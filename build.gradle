buildscript {
	repositories {
		maven {
			url 'https://maven.aliyun.com/repository/public/'
		}
		maven {
			url "https://maven.aliyun.com/nexus/content/groups/public"
		}
		maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
		maven { url 'https://maven.aliyun.com/repository/google' }
		maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
		maven { url 'https://maven.aliyun.com/repository/jcenter' }
		mavenCentral()
		maven { url 'https://s01.oss.sonatype.org' }
		gradlePluginPortal()
		mavenLocal()
		google()
		maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
		maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:7.4.1'
	}
}

allprojects {
	apply plugin: 'eclipse'
	apply plugin: 'idea'

	// This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
	idea {
		module {
			outputDir file('build/classes/java/main')
			testOutputDir file('build/classes/java/test')
		}
	}
}

configure(subprojects - project(':android')) {
	apply plugin: 'java-library'
	sourceCompatibility = 8

/*
  生成资源文件清单（assets.txt）
  - 扫描 assets 目录中的所有文件
  - 按相对路径排序后写入 assets.txt
  - 用于动态加载资源，避免硬编码路径
*/
	tasks.register('generateAssetList') {
		inputs.dir("${project.rootDir}/core/src/main/assets/")
		File assetsFolder = new File("${project.rootDir}/core/src/main/assets/")
		File assetsFile = new File(assetsFolder, "assets.txt")

		assetsFile.delete() // 删除旧的清单文件
		fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
			assetsFile.append(it + "\n") // 写入文件路径
		}
	}
// 将生成任务绑定到资源处理任务
	processResources.dependsOn 'generateAssetList'

	compileJava {
		options.incremental = true
	}
}

subprojects {
	version = '$projectVersion'
	ext.appName = 'GSGDXFramework'
	repositories {
		maven {
			url 'https://maven.aliyun.com/repository/public/'
		}
		maven {
			url "https://maven.aliyun.com/nexus/content/groups/public"
		}
		maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
		maven { url 'https://maven.aliyun.com/repository/google' }
		maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
		maven { url 'https://maven.aliyun.com/repository/jcenter' }
		mavenCentral()
		maven { url 'https://s01.oss.sonatype.org' }
		// You may want to remove the following line if you have errors downloading dependencies.
		mavenLocal()
		maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
		maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
		maven { url 'https://jitpack.io' }
	}
}

eclipse.project.name = 'GSGDXFramework' + '-parent'

